<!doctype html>
<html>
  <head>
    <title>Add Two Numbers</title>
  </head>
  <body>
    <h1>Add Two Numbers</h1>

    <script>
      let number1 = 10;
      let number2 = 20;

      document.write("<h2>The sum is: " + sum + "</h2>");
    </script>
  </body>
